[project]
name = "php2shell-coverage-check"
version = "1.0.0"
description = "Find the hosts where a 'no PHP2Shell finding' result from Tenable can't be trusted."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lance Duvall" }]
requires-python = ">=3.11"
dependencies = ["pytenable>=26.10.1"]

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The workbench module:DeprecationWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
quote-style = "single"
